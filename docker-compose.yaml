
services:
    redis:
        image: redis:alpine
        container_name: redis
        ports:
            - "6379:6379"
        volumes:
            - ./dat/redis:/data
        command: redis-server --maxmemory 32mb""
        logging:
            driver: "none"
        deploy:
            resources:
                limits:
                    cpus: '0.1'
                    memory: 40M
        restart: unless-stopped

services:
    redis:
        image: redis:alpine
        container_name: redis
        ports:
            - "6379:6379"
        volumes:
            - ./data/redis:/data
        command: redis-server --maxmemory 32mb""
        logging:
            driver: "none"
        deploy:
            resources:
                limits:
                    cpus: "0.1"
                    memory: 40M
        restart: unless-stopped

    mysql:
        image: mysql:8.0
        container_name: mysql
        ports:
            - "3306:3306"
        environment:
            MYSQL_ROOT_PASSWORD: aiload
            MYSQL_DATABASE: aiload
            MYSQL_USER: aiload
            MYSQL_PASSWORD: aiload
        volumes:
            - ./data/mysql/data/:/var/lib/mysql
            - ./data/mysql/conf/my.cnf:/etc/my.cnf
        restart: unless-stopped
        deploy:
            resources:
                limits:
                    cpus: "1"
                    memory: 1G

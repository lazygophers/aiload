syntax = "proto3";

package aiload;

import "core.proto";
import "google/protobuf/timestamp.proto";
import "google/protobuf/descriptor.proto";
import "google/protobuf/any.proto";
import "google/protobuf/duration.proto";

option cc_enable_arenas = true;
option go_package = "/aiload";

service aiload {

}

enum ErrCode {
  Success = 0;
}

enum Platform {
  Nil = 0;
  OpenAI = 1;
}

message ModelApi {
  uint64 id = 1;
  int64 created_at = 2;
  int64 updated_at = 3;
  int64 deleted_at = 4;

  string name = 5;
  string token = 6;

  Platform platform = 7;
}

message ModelApiAccess {
  uint64 id = 1;
  int64 created_at = 2;
  int64 updated_at = 3;
  int64 deleted_at = 4;

  uint64 api_id = 5;
  // 对应平台的
  string model = 6;
}

message ModelModelAliasMap {
  uint64 id = 1;
  int64 created_at = 2;
  int64 updated_at = 3;
  int64 deleted_at = 4;

  string model = 5;
  string model_alias = 6;
}

message ModelUser {
  uint64 id = 1;
  int64 created_at = 2;
  int64 updated_at = 3;
  int64 deleted_at = 4;

  string username = 5;
  string password = 6;
}

message ModelUserToken {
  uint64 id = 1;
  int64 created_at = 2;
  int64 updated_at = 3;
  int64 deleted_at = 4;

  uint64 user_id = 5;

  string token = 6;
  int64 limit = 7;
}

message ModelTokenModelAccess {
  uint64 id = 1;
  int64 created_at = 2;
  int64 updated_at = 3;
  int64 deleted_at = 4;

  uint64 token = 5;
  // 跨平台
  string model = 6;
}


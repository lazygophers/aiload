syntax = "proto3";

package aiload;

import "core.proto";

option cc_enable_arenas = true;
option go_package = "/aiload";

service aiload {


	// @gen: user
	// @model: ModelUser
	// @action: add
	rpc AddUserAdmin (AddUserAdminReq) returns (AddUserAdminRsp) {
		option (lazygophers.lrpc.core.http) = {
			method: "POST",
			path: "AddUserAdmin",
		};
		option (lazygophers.lrpc.core.lazygen) = {
			role: "admin",
		};
	};

	// @gen: user
	// @model: ModelUser
	// @action: get
	rpc GetUser (GetUserReq) returns (GetUserRsp) {
		option (lazygophers.lrpc.core.http) = {
			method: "POST",
			path: "GetUser",
		};
		option (lazygophers.lrpc.core.lazygen) = {
		};
	};

	// @gen: user
	// @model: ModelUser
	// @action: get
	rpc GetUserAdmin (GetUserAdminReq) returns (GetUserAdminRsp) {
		option (lazygophers.lrpc.core.http) = {
			method: "POST",
			path: "GetUserAdmin",
		};
		option (lazygophers.lrpc.core.lazygen) = {
			role: "admin",
		};
	};

	// @gen: user
	// @model: ModelUser
	// @action: list
	rpc ListUserAdmin (ListUserAdminReq) returns (ListUserAdminRsp) {
		option (lazygophers.lrpc.core.http) = {
			method: "POST",
			path: "ListUserAdmin",
		};
		option (lazygophers.lrpc.core.lazygen) = {
			role: "admin",
		};
	};

	// @gen: user
	// @model: ModelUser
	// @action: set
	rpc SetUser (SetUserReq) returns (SetUserRsp) {
		option (lazygophers.lrpc.core.http) = {
			method: "POST",
			path: "SetUser",
		};
		option (lazygophers.lrpc.core.lazygen) = {
		};
	};

	// @gen: user
	// @model: ModelUser
	// @action: set
	rpc SetUserAdmin (SetUserAdminReq) returns (SetUserAdminRsp) {
		option (lazygophers.lrpc.core.http) = {
			method: "POST",
			path: "SetUserAdmin",
		};
		option (lazygophers.lrpc.core.lazygen) = {
			role: "admin",
		};
	};

	// @gen: user
	// @model: ModelUser
	// @action: del
	rpc DelUserAdmin (DelUserAdminReq) returns (DelUserAdminRsp) {
		option (lazygophers.lrpc.core.http) = {
			method: "POST",
			path: "DelUserAdmin",
		};
		option (lazygophers.lrpc.core.lazygen) = {
			role: "admin",
		};
	};

	// @gen: login
	// @model: ModelUser
	rpc Login (LoginReq) returns (LoginRsp) {
		option (lazygophers.lrpc.core.http) = {
			method: "POST",
			path: "Login",
		};
		option (lazygophers.lrpc.core.lazygen) = {
			role: "public",
		};
	};


	// @gen: channel
	// @model: ModelChannel
	// @action: set
	rpc SetChannelAdmin (SetChannelAdminReq) returns (SetChannelAdminRsp) {
		option (lazygophers.lrpc.core.http) = {
			method: "POST",
			path: "SetChannelAdmin",
		};
		option (lazygophers.lrpc.core.lazygen) = {
			role: "admin",
		};
	};

	// @gen: channel
	// @model: ModelChannel
	// @action: del
	rpc DelChannelAdmin (DelChannelAdminReq) returns (DelChannelAdminRsp) {
		option (lazygophers.lrpc.core.http) = {
			method: "POST",
			path: "DelChannelAdmin",
		};
		option (lazygophers.lrpc.core.lazygen) = {
			role: "admin",
		};
	};

	// @gen: channel
	// @model: ModelChannel
	// @action: add
	rpc AddChannelAdmin (AddChannelAdminReq) returns (AddChannelAdminRsp) {
		option (lazygophers.lrpc.core.http) = {
			method: "POST",
			path: "AddChannelAdmin",
		};
		option (lazygophers.lrpc.core.lazygen) = {
			role: "admin",
		};
	};

	// @gen: channel
	// @model: ModelChannel
	// @action: get
	rpc GetChannelAdmin (GetChannelAdminReq) returns (GetChannelAdminRsp) {
		option (lazygophers.lrpc.core.http) = {
			method: "POST",
			path: "GetChannelAdmin",
		};
		option (lazygophers.lrpc.core.lazygen) = {
			role: "admin",
		};
	};

	// @gen: channel
	// @model: ModelChannel
	// @action: list
	rpc ListChannelAdmin (ListChannelAdminReq) returns (ListChannelAdminRsp) {
		option (lazygophers.lrpc.core.http) = {
			method: "POST",
			path: "ListChannelAdmin",
		};
		option (lazygophers.lrpc.core.lazygen) = {
			role: "admin",
		};
	};


	// @gen: channel
	// @model: ModelChannel
	rpc GetModelListAdmin (GetModelListAdminReq) returns (GetModelListAdminRsp) {
		option (lazygophers.lrpc.core.http) = {
			method: "POST",
			path: "GetModelListAdmin",
		};
		option (lazygophers.lrpc.core.lazygen) = {
			role: "admin",
		};
	};

}

enum ErrCode {
	Success = 0;

	ModelAliasNotFound = 10000;// 模型别名未找到
	ModelAliasDuplicateKey = 10001;// 模型别名重复
	ChannelNotFound = 10002;// 渠道未找到
	ChannelDuplicateKey = 10003;// 渠道重复
	UserTokenNotFound = 10004;// 用户token未找到
	UserTokenDuplicateKey = 10005;// 用户token重复
	UserDuplicateKey = 10006;// 用户重复
	UserNotFound = 10007;// 用户未找到
	UserAccessNotFound = 10008;// 用户访问未找到
	UserAccessDuplicateKey = 10009;// 用户访问重复
	ChannelModelNotFound = 10010;// 渠道模型未找到
	ChannelModelDuplicateKey = 10011;// 渠道模型重复
}

enum UserRole {
	Public = 0;
	User = 1;
	Admin = 2;
	System = 3;
}

enum Platform {
	Nil = 0;
	OpenAiCompatible = 1;
	Siliconflow = 2;
	Gemini = 3;
	Ollama = 4;
	OpenAi = 5;
}

enum State {
	Enable = 0;// 启用
	Disable = 1;// 禁用
	AutoDisable = 2;// 自动禁用
}

message ModelChannel {
	uint64 id = 1;
	int64 created_at = 2;
	int64 updated_at = 3;
	// @gorm: index: idx_channel,unique
	int64 deleted_at = 4;

	// @v: required
	string name = 5;
	// @gorm: index: idx_channel,unique
	// @v: required
	string token = 6;
	// @gorm: index: idx_channel,unique
	// @v: required
	Platform platform = 7;

	// @doc: base_url is the base url of the model channel.
	string base_url = 8;

	State state = 10;

	// @gorm: -
	repeated string model_list = 9;

	bool enable_auto_update_model = 11;
	bool enable_auto_check_model = 12;
}

message ModelChannelModel {
	uint64 id = 1;
	int64 created_at = 2;
	int64 updated_at = 3;
	// @gorm: index: idx_channel_access,unique
	int64 deleted_at = 4;

	// @gorm: index: idx_channel_access,unique
	uint64 channel_id = 5;
	// @gorm: index: idx_channel_access,unique
	string model = 6;

	State state = 7;
}

message ModelModelAlias {
	uint64 id = 1;
	int64 created_at = 2;
	int64 updated_at = 3;
	// gorm: index:idx_alias,unique
	int64 deleted_at = 4;

	// gorm: index:idx_alias,unique
	string model = 5;
	// gorm: index:idx_alias,unique
	string model_alias = 6;
}

message ModelUser {
	uint64 id = 1;
	int64 created_at = 2;
	int64 updated_at = 3;
	// gorm: index:idx_user,unique
	int64 deleted_at = 4;

	// gorm: index:idx_user,unique
	string username = 5;
	string password = 6;
	string name = 7;

	UserRole role = 8;
}

message ModelUserToken {
	uint64 id = 1;
	int64 created_at = 2;
	int64 updated_at = 3;
	// gorm: index:idx_token,unique
	int64 deleted_at = 4;

	// gorm: index:idx_token,unique
	uint64 user_id = 5;

	// gorm: index:idx_token,unique
	string token = 6;
	int64 limit = 7;
}

message ModelUserAccess {
	uint64 id = 1;
	int64 created_at = 2;
	int64 updated_at = 3;
	// @gorm: index:idx_user_access,unique
	int64 deleted_at = 4;
	// @gorm: index:idx_user_access,unique
	uint64 token = 5;
	// @gorm: index:idx_user_access,unique
	string model = 6;
}

message MqTaskId {
	// @v: required
	uint64 id = 1;
	bool force = 2;
}

message AddUserAdminReq {
	// @validate: required
	ModelUser user = 1;
}

message AddUserAdminRsp {
	ModelUser user = 1;
}

message GetUserReq {

}

message GetUserRsp {
	ModelUser user = 1;
}

message GetUserAdminReq {
	// @validate: required
	uint64 id = 1;
}

message GetUserAdminRsp {
	ModelUser user = 1;
}

message ListUserAdminReq {
	enum ListOption {
		ListOptionNil = 0;
		// @type: like
		ListOptionName = 1;
		// @type: like
		ListOptionUsername = 2;
	}

	// @validate: required
	lazygophers.lrpc.core.ListOption list_option = 1;
}

message ListUserAdminRsp {
	lazygophers.lrpc.core.Paginate paginate = 1;
	repeated ModelUser list = 2;
}

message SetUserReq {
	// @validate: required
	ModelUser user = 1;
}

message SetUserRsp {
	ModelUser user = 1;
}

message SetUserAdminReq {
	// @validate: required
	ModelUser user = 1;
}

message SetUserAdminRsp {
	ModelUser user = 1;
}

message DelUserAdminReq {
	// @validate: required
	uint64 id = 1;
}

message DelUserAdminRsp {
}

message LoginReq {
	// @validate: required
	string username = 1;
	// @validate: required
	string password = 2;
}

message LoginRsp {
	ModelUser user = 1;
	string token = 2;
	int64 expires_at = 3;
}

message SetChannelAdminReq {
	// @validate: required
	ModelChannel channel = 1;
}

message SetChannelAdminRsp {
	ModelChannel channel = 1;
}

message DelChannelAdminReq {
	// @validate: required
	uint64 id = 1;
}

message DelChannelAdminRsp {
}

message AddChannelAdminReq {
	// @validate: required
	ModelChannel channel = 1;
}

message AddChannelAdminRsp {
	ModelChannel channel = 1;
}

message GetChannelAdminReq {
	// @validate: required
	uint64 id = 1;
}

message GetChannelAdminRsp {
	ModelChannel channel = 1;
}

message ListChannelAdminReq {
	enum ListOption {
		ListOptionNil = 0;
		// @type: uint32
		ListOptionPlatform = 1;
		// @type: like
		ListOptionName = 2;
		// @type: like
		ListOptionToken = 3;
		// @type: like
		ListOptionBaseUrl = 4;
	}

	// @validate: required
	lazygophers.lrpc.core.ListOption list_option = 1;
}

message ListChannelAdminRsp {
	lazygophers.lrpc.core.Paginate paginate = 1;
	repeated ModelChannel list = 2;
}

message GetModelListAdminReq {
	// @validate: required
	ModelChannel channel = 1;
}

message GetModelListAdminRsp {
	repeated string model_list = 1;
}
